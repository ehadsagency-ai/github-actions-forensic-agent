name: Test GitHub Actions Forensic Agent

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Tests hebdomadaires le lundi à 2h

jobs:
  test:
    name: Test sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20]
      fail-fast: false

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Linting du code
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Test de l'action (auto-analyse)
        id: forensic-test
        uses: ./
        with:
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deep-scan: false
          max-runs: 10
          output-format: 'both'

      - name: Validation des outputs
        run: |
          echo "Hidden failures: ${{ steps.forensic-test.outputs.hidden-failures }}"
          echo "Success: ${{ steps.forensic-test.outputs.success }}"
          echo "Report path: ${{ steps.forensic-test.outputs.report-path }}"
          
          # Vérification que les outputs sont définis
          if [ -z "${{ steps.forensic-test.outputs.success }}" ]; then
            echo "❌ Output 'success' manquant"
            exit 1
          fi
          
          if [ -z "${{ steps.forensic-test.outputs.report-path }}" ]; then
            echo "❌ Output 'report-path' manquant"
            exit 1
          fi

      - name: Vérification des fichiers de rapport
        run: |
          if [ -f "${{ steps.forensic-test.outputs.report-path }}" ]; then
            echo "✅ Rapport trouvé: ${{ steps.forensic-test.outputs.report-path }}"
            ls -la ${{ steps.forensic-test.outputs.report-path }}
          else
            echo "❌ Fichier de rapport manquant"
            exit 1
          fi

      - name: Upload des rapports de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}-node${{ matrix.node-version }}
          path: |
            *.md
            *.json
            coverage/

  test-error-cases:
    name: Test des cas d'erreur
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Test avec token invalide
        id: test-invalid-token
        continue-on-error: true
        uses: ./
        with:
          repository: ${{ github.repository }}
          github-token: 'invalid-token'
          deep-scan: false

      - name: Vérification de l'échec attendu
        run: |
          if [ "${{ steps.test-invalid-token.outputs.success }}" = "true" ]; then
            echo "❌ L'action aurait dû échouer avec un token invalide"
            exit 1
          else
            echo "✅ Échec attendu avec token invalide"
          fi

      - name: Test avec dépôt inexistant
        id: test-invalid-repo
        continue-on-error: true
        uses: ./
        with:
          repository: 'inexistant/repo-qui-nexiste-pas'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérification de l'échec pour dépôt inexistant
        run: |
          if [ "${{ steps.test-invalid-repo.outputs.success }}" = "true" ]; then
            echo "❌ L'action aurait dû échouer avec un dépôt inexistant"
            exit 1
          else
            echo "✅ Échec attendu avec dépôt inexistant"
          fi

  integration-test:
    name: Test d'intégration complet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Analyse forensique complète
        id: full-analysis
        uses: ./
        with:
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deep-scan: true
          max-runs: 25
          output-format: 'both'

      - name: Analyse des résultats
        run: |
          echo "=== Résultats de l'analyse forensique ==="
          echo "Échecs cachés: ${{ steps.full-analysis.outputs.hidden-failures }}"
          echo "Problèmes critiques: ${{ steps.full-analysis.outputs.critical-issues }}"
          echo "Rapport: ${{ steps.full-analysis.outputs.report-path }}"
          
          # Affichage du contenu du rapport JSON s'il existe
          if [ -f "forensic-analysis-report.json" ]; then
            echo "=== Extrait du rapport JSON ==="
            jq '.summary' forensic-analysis-report.json || echo "Erreur lors de la lecture du JSON"
          fi

      - name: Vérification de la qualité du rapport
        run: |
          # Vérification que le rapport Markdown contient les sections attendues
          if [ -f "forensic-analysis-report.md" ]; then
            echo "✅ Rapport Markdown généré"
            
            # Vérification des sections obligatoires
            if grep -q "Résumé Exécutif" forensic-analysis-report.md; then
              echo "✅ Section 'Résumé Exécutif' trouvée"
            else
              echo "❌ Section 'Résumé Exécutif' manquante"
              exit 1
            fi
            
            if grep -q "Score de Risque" forensic-analysis-report.md; then
              echo "✅ Section 'Score de Risque' trouvée"
            else
              echo "❌ Section 'Score de Risque' manquante"
              exit 1
            fi
          else
            echo "❌ Rapport Markdown non généré"
            exit 1
          fi

      - name: Upload des rapports d'intégration
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            forensic-analysis-report.md
            forensic-analysis-report.json

  security-test:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Audit de sécurité npm
        run: npm audit --audit-level=moderate

      - name: Scan des secrets avec GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Analyse statique avec CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v3

