name: 'GitHub Actions Forensic Agent'
description: 'Scan workflow runs for hidden failures, secret-like log smells, dangerous shell patterns, and over-broad permissions.'
author: 'ehadsagency-ai'

branding:
  icon: 'search'
  color: 'red'

inputs:
  repository:
    description: 'Repository to analyze (format: owner/repo)'
    required: true
  github-token:
    description: 'GitHub token for API authentication'
    required: true
  deep-scan:
    description: 'Enable deeper log analysis'
    required: false
    default: 'false'
  max-runs:
    description: 'Maximum number of workflow runs to inspect'
    required: false
    default: '50'
  output-format:
    description: 'Report format (json, markdown, both)'
    required: false
    default: 'both'

outputs:
  hidden-failures:
    description: 'Count of hidden failures detected'
  critical-issues:
    description: 'JSON list of critical findings'
  report-path:
    description: 'Path to the generated report file'
  success:
    description: 'Whether the analysis completed successfully'

runs:
  using: 'node20'
  main: 'src/main.js'
